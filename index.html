<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Little Living Town - Prototype 0.2</title><meta name="theme-color" content="#f5efe5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Little Town"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>*{box-sizing:border-box}html,body{overscroll-behavior:none}body{margin:0;background:#f5efe5;color:#453d35;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{padding:10px 14px;background:#fff9ef;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:16px;margin:0}button,select{border:1px solid #c8b8a4;border-radius:10px;background:#fffaf2;color:#453d35;padding:10px;font-size:14px;min-height:44px;-webkit-tap-highlight-color:transparent}button.active{background:#d2e7cb;border-color:#82aa78}button:disabled{opacity:.45}.toolbar,.palette,.bottom{display:flex;gap:6px;padding:8px;overflow-x:auto;align-items:center;flex-wrap:wrap}.toolbar{background:#eee4d6}.palette{background:#faf5ed;flex-wrap:nowrap}.bottom{justify-content:center}#stage{width:100%;height:min(62vh,620px);display:block;touch-action:none;background:#d9e4d2;-webkit-user-select:none;user-select:none}small{display:block;padding:5px 12px;color:#766a5e;line-height:1.5}#status{font-size:12px;padding:4px 12px;min-height:24px}.pill{white-space:nowrap}.selected{outline:3px solid #83b79a}@media(max-width:600px){button,select{padding:9px;font-size:13px}#stage{height:56vh}}</style></head><body><header><h1>🌿 Little Living Town <span style="font-size:11px;font-weight:normal">v0.2</span></h1><span><button id="exportBtn">書き出し</button> <button id="importBtn">読み込み</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"> <button id="reset">初期化</button></span></header><div class="toolbar"><button id="edit" class="active">🛠 編集</button><button id="walk">🚶 散歩</button><button id="rotate">↻ 回転</button><button id="remove">🗑 撤去</button><button id="undo">⤺ 戻す</button><button id="zoomOut">−</button><button id="zoomIn">＋</button><select id="floor"><option value="wood">床：木目</option><option value="cream">床：クリーム</option><option value="green">床：グリーン</option></select><select id="wall"><option value="cream">壁：クリーム</option><option value="stripe">壁：ストライプ</option><option value="dot">壁：ドット</option></select></div><canvas id="stage"></canvas><div class="palette" id="palette"></div><div class="bottom" id="arrows" style="display:none"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div id="status"></div><small>編集：家具を選んでタップで配置、家具はドラッグで移動（置ける場所は緑、置けない場所は赤で表示）。2本指で拡大・縮小と画面移動、PCはホイール拡大＋右ドラッグ移動。散歩：画面タップ／矢印ボタン／キーボードで移動。変更は自動保存されます。</small><script>
(()=>{'use strict';
/* ===== 基本定義 ===== */
const W=12,H=9,T=48,WALL_RATIO=0.6;
const KEY2='llt_v02_state',KEY1='llt_v01_state';
const TYPES={
sofa:{name:'ソファ',w:2,h:1,c:'#c68f85',icon:'🛋️'},
bed:{name:'ベッド',w:2,h:2,c:'#9fb9cc',icon:'🛏️'},
table:{name:'テーブル',w:2,h:1,c:'#b88b60',icon:'🪵'},
chair:{name:'椅子',w:1,h:1,c:'#c5a477',icon:'🪑'},
shelf:{name:'棚',w:2,h:1,c:'#9d7956',icon:'📚'},
plant:{name:'植物',w:1,h:1,c:'#6b9a72',icon:'🪴'},
rug:{name:'ラグ',w:3,h:2,c:'#d7b3a4',icon:'🧶',pass:true},
lamp:{name:'照明',w:1,h:1,c:'#edc46c',icon:'💡'}};
const FLOORS={wood:['#e8cda6','#e4c69d'],cream:['#f0e7d4','#ece1cc'],green:['#cbdcb9','#c5d4b1']};
const WALLS={cream:{base:'#f5ecdc',sub:null},stripe:{base:'#edf2e4',sub:'rgba(110,145,100,.28)'},dot:{base:'#f8e9e4',sub:'rgba(198,110,120,.35)'}};
/* roundRect フォールバック（iOS 15以前対策） */
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
/* ===== 状態と保存（v2形式・v0.1から移行） ===== */
function defaultState(){return{version:2,items:[{id:1,type:'bed',x:1,y:1,rot:0},{id:2,type:'sofa',x:7,y:2,rot:0},{id:3,type:'plant',x:10,y:1,rot:0},{id:4,type:'rug',x:5,y:5,rot:0}],floor:'wood',wall:'cream',player:{x:6,y:7,dir:'down'},nextId:5}}
function sanitize(raw){if(!raw||!Array.isArray(raw.items)||!raw.player)return null;const items=[];for(const o of raw.items){const t=TYPES[o.type];if(!t)continue;const rot=((o.rot|0)%4+4)%4;const d={w:rot%2?t.h:t.w,h:rot%2?t.w:t.h};items.push({id:o.id|0,type:o.type,x:Math.max(0,Math.min(W-d.w,o.x|0)),y:Math.max(0,Math.min(H-d.h,o.y|0)),rot})}const maxId=items.reduce((m,o)=>Math.max(m,o.id),0);return{version:2,items,floor:FLOORS[raw.floor]?raw.floor:'wood',wall:WALLS[raw.wall]?raw.wall:'cream',player:{x:Math.max(0,Math.min(W-1,raw.player.x|0)),y:Math.max(0,Math.min(H-1,raw.player.y|0)),dir:['up','down','left','right'].includes(raw.player.dir)?raw.player.dir:'down'},nextId:Math.max(raw.nextId|0,maxId+1)}}
let state=defaultState();
try{const v2=JSON.parse(localStorage.getItem(KEY2));const v1=v2?null:JSON.parse(localStorage.getItem(KEY1));const s=sanitize(v2||v1);if(s)state=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY2,JSON.stringify(state))}catch(e){}};
save();
/* 取り消し履歴 */
const history=[];const snapshot=()=>{history.push(JSON.stringify({items:state.items,floor:state.floor,wall:state.wall,player:state.player,nextId:state.nextId}));if(history.length>40)history.shift();updUndo()};
/* ===== DOM ===== */
const c=document.getElementById('stage'),ctx=c.getContext('2d'),palette=document.getElementById('palette'),statusEl=document.getElementById('status');
let mode='edit',type='sofa',selected=null,drag=null,pendingTap=null,zoom=1,pan={x:0,y:0},geom=null,pinch=null;
const pointers=new Map();
const msg=s=>statusEl.textContent=s;
function updUndo(){const b=document.getElementById('undo');if(b)b.disabled=!history.length}
/* ===== 座標・判定 ===== */
const footprint=o=>{const t=TYPES[o.type];return{w:o.rot%2?t.h:t.w,h:o.rot%2?t.w:t.h}};
const overlap=(a,b)=>{const x=footprint(a),y=footprint(b);return a.x<b.x+y.w&&a.x+x.w>b.x&&a.y<b.y+y.h&&a.y+x.h>b.y};
const valid=(o,ignore)=>{const d=footprint(o);return o.x>=0&&o.y>=0&&o.x+d.w<=W&&o.y+d.h<=H&&!state.items.some(v=>v.id!==ignore&&!TYPES[v.type].pass&&!TYPES[o.type].pass&&overlap(o,v))};
const hit=(x,y)=>[...state.items].reverse().find(o=>{const d=footprint(o);return x>=o.x&&x<o.x+d.w&&y>=o.y&&y<o.y+d.h});
function computeGeom(){const cw=c.clientWidth,ch=c.clientHeight;const s0=Math.min((cw-24)/(W*T),(ch-24)/((H+WALL_RATIO)*T));const tw=T*s0*zoom,wallH=tw*WALL_RATIO,roomW=W*tw,roomH=H*tw+wallH;const ox=(cw-roomW)/2+pan.x,oy=(ch-roomH)/2+wallH+pan.y;return{cw,ch,tw,wallH,ox,oy,roomW,roomH}}
function clampPan(){const g=computeGeom();let ox=g.ox,top=g.oy-g.wallH;const minOx=g.cw-g.roomW-60,maxOx=60;ox=minOx<=maxOx?Math.max(minOx,Math.min(maxOx,ox)):(g.cw-g.roomW)/2;const minTop=g.ch-g.roomH-60,maxTop=60;top=minTop<=maxTop?Math.max(minTop,Math.min(maxTop,top)):(g.ch-g.roomH)/2;pan.x=ox-(g.cw-g.roomW)/2;pan.y=top-(g.ch-g.roomH)/2}
function point(e){const r=c.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left-geom.ox)/geom.tw),y:Math.floor((e.clientY-r.top-geom.oy)/geom.tw)}}
function zoomAt(cx,cy,factor){const r=c.getBoundingClientRect(),lx=cx-r.left,ly=cy-r.top;const g0=computeGeom();const wx=(lx-g0.ox)/g0.tw,wy=(ly-g0.oy)/g0.tw;zoom=Math.max(0.6,Math.min(2.5,zoom*factor));const g1=computeGeom();pan.x+=lx-wx*g1.tw-g1.ox;pan.y+=ly-wy*g1.tw-g1.oy;clampPan();draw()}
/* ===== 家具の描画（方向つき簡易イラスト） ===== */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawFurniture(o,px,py,tw,alpha){const t=TYPES[o.type],bw=t.w*tw,bh=t.h*tw;ctx.save();ctx.globalAlpha=alpha;ctx.translate(px+footprint(o).w*tw/2,py+footprint(o).h*tw/2);ctx.rotate(o.rot*Math.PI/2);ctx.translate(-bw/2,-bh/2);ctx.fillStyle='rgba(69,53,43,.18)';rr(tw*.06,tw*.09,bw-tw*.08,bh-tw*.04,tw*.1);ctx.fill();const u=tw;
if(o.type==='sofa'){ctx.fillStyle=t.c;rr(0,0,bw,bh,u*.14);ctx.fill();ctx.fillStyle='rgba(0,0,0,.16)';rr(0,0,bw,bh*.34,u*.14);ctx.fill();rr(0,0,u*.16,bh,u*.08);ctx.fill();rr(bw-u*.16,0,u*.16,bh,u*.08);ctx.fill();ctx.fillStyle='rgba(255,255,255,.20)';rr(u*.2,bh*.42,bw*.28,bh*.4,u*.08);ctx.fill();rr(u*.52,bh*.42,bw*.28,bh*.4,u*.08);ctx.fill()}
else if(o.type==='bed'){ctx.fillStyle='#8a6f52';rr(0,0,bw,bh,u*.08);ctx.fill();ctx.fillStyle='#f4efe4';rr(u*.05,u*.05,bw-u*.1,bh-u*.1,u*.06);ctx.fill();ctx.fillStyle=t.c;rr(u*.05,bh*.38,bw-u*.1,bh*.57,u*.06);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';rr(u*.05,bh*.38,bw-u*.1,bh*.1,0);ctx.fill();ctx.fillStyle='#fffdf6';rr(u*.12,u*.1,bw*.32,bh*.2,u*.06);ctx.fill();rr(bw*.56,u*.1,bw*.32,bh*.2,u*.06);ctx.fill()}
else if(o.type==='table'){ctx.fillStyle='rgba(0,0,0,.20)';ctx.fillRect(u*.08,bh-u*.14,u*.12,u*.12);ctx.fillRect(bw-u*.2,bh-u*.14,u*.12,u*.12);ctx.fillStyle=t.c;rr(0,0,bw,bh*.86,u*.08);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';rr(u*.07,u*.07,bw-u*.14,bh*.6,u*.06);ctx.fill();ctx.strokeStyle='rgba(90,55,25,.35)';ctx.lineWidth=1.5;ctx.strokeRect(u*.07,u*.07,bw-u*.14,bh*.6)}
else if(o.type==='chair'){ctx.fillStyle=t.c;rr(0,0,bw,bh,u*.16);ctx.fill();ctx.fillStyle='rgba(0,0,0,.18)';rr(0,0,bw,bh*.3,u*.16);ctx.fill();ctx.fillStyle='rgba(255,255,255,.20)';rr(u*.16,bh*.4,bw-u*.32,bh*.42,u*.1);ctx.fill()}
else if(o.type==='shelf'){ctx.fillStyle=t.c;rr(0,0,bw,bh,u*.06);ctx.fill();ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,bh*.48,bw,u*.06);const cols=['#b5543f','#3f6fb5','#4d8a5a','#c9a227','#7a4d9e','#3f8a8a'];for(let i=0;i<6;i++){ctx.fillStyle=cols[i];const bx=u*.1+i*(bw-u*.2)/6;ctx.fillRect(bx,bh*.12,(bw-u*.2)/6-u*.05,bh*.34)}for(let i=0;i<4;i++){ctx.fillStyle=cols[(i+3)%6];const bx=u*.12+i*(bw-u*.24)/4;ctx.fillRect(bx,bh*.6,(bw-u*.24)/4-u*.05,bh*.3)}}
else if(o.type==='plant'){ctx.fillStyle='#7db07f';ctx.beginPath();ctx.ellipse(bw/2,bh*.34,u*.3,u*.22,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5c8a63';ctx.beginPath();ctx.ellipse(bw*.34,bh*.42,u*.18,u*.14,-.5,0,Math.PI*2);ctx.ellipse(bw*.66,bh*.42,u*.18,u*.14,.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a5694f';ctx.beginPath();ctx.moveTo(bw*.32,bh*.58);ctx.lineTo(bw*.68,bh*.58);ctx.lineTo(bw*.6,bh*.94);ctx.lineTo(bw*.4,bh*.94);ctx.closePath();ctx.fill()}
else if(o.type==='rug'){ctx.fillStyle=t.c;rr(0,0,bw,bh,u*.1);ctx.fill();ctx.strokeStyle='rgba(150,90,80,.55)';ctx.lineWidth=2;rr(u*.09,u*.12,bw-u*.18,bh-u*.24,u*.08);ctx.stroke();ctx.beginPath();ctx.moveTo(bw/2,bh*.24);ctx.lineTo(bw*.68,bh/2);ctx.lineTo(bw/2,bh*.76);ctx.lineTo(bw*.32,bh/2);ctx.closePath();ctx.stroke()}
else if(o.type==='lamp'){ctx.fillStyle='rgba(237,196,108,.30)';ctx.beginPath();ctx.arc(bw/2,bh*.34,u*.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8a6f52';ctx.fillRect(bw/2-1.5,bh*.4,3,bh*.42);ctx.beginPath();ctx.ellipse(bw/2,bh*.88,u*.2,u*.06,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=t.c;ctx.beginPath();ctx.moveTo(bw*.3,bh*.36);ctx.lineTo(bw*.7,bh*.36);ctx.lineTo(bw*.6,bh*.08);ctx.lineTo(bw*.4,bh*.08);ctx.closePath();ctx.fill()}
ctx.restore()}
/* ===== 全体描画 ===== */
function resize(){const rect=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);clampPan();draw()}
function draw(){if(!c.clientWidth)return;geom=computeGeom();const{tw,ox,oy,wallH,cw,ch}=geom;ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#dce7d6';ctx.fillRect(0,0,cw,ch);
ctx.fillStyle='#a17b61';rr(ox-10,oy-wallH-10,W*tw+20,H*tw+wallH+20,6);ctx.fill();
/* 北壁（壁紙） */
const wp=WALLS[state.wall]||WALLS.cream;ctx.save();rr(ox-10,oy-wallH-10,W*tw+20,wallH+10,6);ctx.clip();ctx.fillStyle=wp.base;ctx.fillRect(ox-10,oy-wallH-10,W*tw+20,wallH+10);if(state.wall==='stripe'&&wp.sub){ctx.fillStyle=wp.sub;for(let x=ox;x<ox+W*tw;x+=tw/2)ctx.fillRect(x,oy-wallH-10,tw*.16,wallH+10)}if(state.wall==='dot'&&wp.sub){ctx.fillStyle=wp.sub;for(let gy=0;gy<2;gy++)for(let gx=0;gx<W*2;gx++){ctx.beginPath();ctx.arc(ox+gx*tw/2+tw*.25,oy-wallH+gy*wallH/2+wallH*.22,Math.max(2,tw*.06),0,Math.PI*2);ctx.fill()}}ctx.restore();
ctx.fillStyle='#cbb59a';ctx.fillRect(ox-10,oy-7,W*tw+20,7);
/* 床 */
for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=(FLOORS[state.floor]||FLOORS.wood)[(x+y)%2];ctx.fillRect(ox+x*tw,oy+y*tw,tw,tw);ctx.strokeStyle='rgba(100,75,50,.10)';ctx.strokeRect(ox+x*tw,oy+y*tw,tw,tw)}
/* エンティティ（奥行き順：ラグ→家具・プレイヤーを底辺Yで整列） */
const ents=[];for(const o of state.items){if(drag&&o.id===drag.id)continue;const d=footprint(o);ents.push({kind:'item',o,sortY:TYPES[o.type].pass?-1e6+o.y+d.h:o.y+d.h})}ents.push({kind:'player',sortY:state.player.y+1});ents.sort((a,b)=>a.sortY-b.sortY);
for(const e of ents){if(e.kind==='player')drawPlayer(tw,ox,oy);else{const o=e.o,d=footprint(o);drawFurniture(o,ox+o.x*tw,oy+o.y*tw,tw,1)}}
/* ドラッグ中ゴースト */
if(drag){const o=state.items.find(v=>v.id===drag.id);if(o&&drag.cand){const d=footprint(o);drawFurniture(o,ox+drag.cand.x*tw,oy+drag.cand.y*tw,tw,.8);ctx.fillStyle=drag.cand.ok?'rgba(70,170,90,.35)':'rgba(210,60,50,.35)';ctx.fillRect(ox+drag.cand.x*tw,oy+drag.cand.y*tw,d.w*tw,d.h*tw);ctx.strokeStyle=drag.cand.ok?'#2e8b4f':'#c23a2e';ctx.lineWidth=2;ctx.strokeRect(ox+drag.cand.x*tw,oy+drag.cand.y*tw,d.w*tw,d.h*tw)}}
/* 選択枠 */
if(selected!==null&&!drag){const o=state.items.find(v=>v.id===selected);if(o){const d=footprint(o);ctx.strokeStyle='#347d60';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.strokeRect(ox+o.x*tw+2,oy+o.y*tw+2,d.w*tw-4,d.h*tw-4);ctx.setLineDash([])}}}
function drawPlayer(tw,ox,oy){const p=state.player,cxp=ox+(p.x+.5)*tw,cyp=oy+(p.y+.5)*tw;ctx.fillStyle='rgba(69,53,43,.25)';ctx.beginPath();ctx.ellipse(cxp,cyp+tw*.28,tw*.24,tw*.11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6c86aa';rr(cxp-tw*.21,cyp+tw*.02,tw*.42,tw*.32,tw*.1);ctx.fill();ctx.fillStyle='#f3d4b7';ctx.beginPath();ctx.arc(cxp,cyp-tw*.14,tw*.21,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4a3b32';ctx.beginPath();ctx.arc(cxp,cyp-tw*.2,tw*.21,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#333';const eo={up:[0,-.02],down:[0,.03],left:[-.05,0],right:[.05,0]}[p.dir]||[0,.03];if(p.dir!=='up'){ctx.beginPath();ctx.arc(cxp-tw*.08+eo[0]*tw,cyp-tw*.12+eo[1]*tw,tw*.028,0,Math.PI*2);ctx.arc(cxp+tw*.08+eo[0]*tw,cyp-tw*.12+eo[1]*tw,tw*.028,0,Math.PI*2);ctx.fill()}}
/* ===== プレイヤー移動 ===== */
function move(dx,dy){const p=state.player,x=p.x+dx,y=p.y+dy;p.dir=dx<0?'left':dx>0?'right':dy<0?'up':'down';if(x<0||y<0||x>=W||y>=H){draw();return}const block=state.items.some(o=>!TYPES[o.type].pass&&x>=o.x&&x<o.x+footprint(o).w&&y>=o.y&&y<o.y+footprint(o).h);if(!block){p.x=x;p.y=y;save()}draw()}
/* ===== 入力（タップ／ドラッグ／ピンチ） ===== */
function placeAt(cell){const n={id:state.nextId++,type,x:cell.x,y:cell.y,rot:0};if(valid(n)){snapshot();state.items.push(n);selected=n.id;save();draw();msg(TYPES[type].name+'を配置しました')}else{state.nextId--;msg('そこには配置できません')}}
function endDrag(commit){if(!drag)return;const o=state.items.find(v=>v.id===drag.id);if(o&&commit&&drag.cand&&drag.cand.ok&&(o.x!==drag.cand.x||o.y!==drag.cand.y)){snapshot();o.x=drag.cand.x;o.y=drag.cand.y;save();msg(TYPES[o.type].name+'を移動しました')}drag=null;draw()}
c.addEventListener('pointerdown',e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(err){}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pointers.size===2){if(drag){const o=state.items.find(v=>v.id===drag.id);if(o){o.x=drag.oldX;o.y=drag.oldY}drag=null}pendingTap=null;const ps=[...pointers.values()];pinch={dist:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mx:(ps[0].x+ps[1].x)/2,my:(ps[0].y+ps[1].y)/2};draw();return}
if(pointers.size>1)return;
if(e.button===2){pinch={mouse:true,mx:e.clientX,my:e.clientY};return}
if(!geom)geom=computeGeom();const cell=point(e);if(cell.x<0||cell.y<0||cell.x>=W||cell.y>=H)return;
if(mode==='edit'){const o=hit(cell.x+.5,cell.y+.5);if(o){selected=o.id;drag={id:o.id,offsetX:cell.x-o.x,offsetY:cell.y-o.y,oldX:o.x,oldY:o.y,cand:{x:o.x,y:o.y,ok:true}};msg(TYPES[o.type].name+'を選択中');draw()}else pendingTap={cell,sx:e.clientX,sy:e.clientY}}
else pendingTap={cell,sx:e.clientX,sy:e.clientY,walk:true}});
c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)&&!pinch)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pinch){if(pinch.mouse){pan.x+=e.clientX-pinch.mx;pan.y+=e.clientY-pinch.my;pinch.mx=e.clientX;pinch.my=e.clientY;clampPan();draw();return}if(pointers.size===2){const ps=[...pointers.values()];const dist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mx=(ps[0].x+ps[1].x)/2,my=(ps[0].y+ps[1].y)/2;if(pinch.dist>0)zoom=Math.max(0.6,Math.min(2.5,zoom*dist/pinch.dist));pan.x+=mx-pinch.mx;pan.y+=my-pinch.my;pinch={dist,mx,my};clampPan();draw()}return}
if(pendingTap&&Math.hypot(e.clientX-pendingTap.sx,e.clientY-pendingTap.sy)>12)pendingTap=null;
if(!drag||mode!=='edit')return;const cell=point(e),o=state.items.find(v=>v.id===drag.id);if(!o)return;const nx=cell.x-drag.offsetX,ny=cell.y-drag.offsetY;drag.cand={x:nx,y:ny,ok:valid({...o,x:nx,y:ny},o.id)};draw()});
function releasePointer(e){pointers.delete(e.pointerId);if(pinch&&!pinch.mouse&&pointers.size<2)pinch=null;if(pinch&&pinch.mouse)pinch=null;
if(drag){endDrag(true);return}
if(pendingTap){const t=pendingTap;pendingTap=null;if(t.walk){const dx=t.cell.x-state.player.x,dy=t.cell.y-state.player.y;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else if(dy!==0)move(0,Math.sign(dy))}else placeAt(t.cell)}}
c.addEventListener('pointerup',releasePointer);
c.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=null;if(drag){const o=state.items.find(v=>v.id===drag.id);if(o){o.x=drag.oldX;o.y=drag.oldY}drag=null;draw()}pendingTap=null});
c.addEventListener('contextmenu',e=>e.preventDefault());
c.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:0.89)},{passive:false});
/* ===== UI ===== */
function updatePalette(){palette.innerHTML='';for(const[k,v]of Object.entries(TYPES)){const b=document.createElement('button');b.textContent=v.icon+' '+v.name;b.className='pill'+(k===type?' selected':'');b.onclick=()=>{type=k;selected=null;updatePalette();msg(v.name+'を選択しました')};palette.append(b)}}
function setMode(m){mode=m;document.getElementById('edit').classList.toggle('active',m==='edit');document.getElementById('walk').classList.toggle('active',m==='walk');document.getElementById('arrows').style.display=m==='walk'?'flex':'none';msg(m==='edit'?'家具をタップして選択・ドラッグで移動':'画面タップまたは矢印で歩く');draw()}
document.getElementById('edit').onclick=()=>setMode('edit');
document.getElementById('walk').onclick=()=>setMode('walk');
document.getElementById('rotate').onclick=()=>{const o=state.items.find(v=>v.id===selected);if(!o)return msg('先に家具を選択してください');const next={...o,rot:(o.rot+1)%4};if(valid(next,o.id)){snapshot();o.rot=next.rot;save();draw()}else msg('回転先に空きがありません')};
document.getElementById('remove').onclick=()=>{if(selected===null)return msg('先に家具を選択してください');snapshot();state.items=state.items.filter(o=>o.id!==selected);selected=null;save();draw();msg('撤去しました')};
document.getElementById('undo').onclick=()=>{const s=history.pop();if(!s)return;const prev=JSON.parse(s);state.items=prev.items;state.floor=prev.floor;state.wall=prev.wall;state.player=prev.player;state.nextId=prev.nextId;selected=null;document.getElementById('floor').value=state.floor;document.getElementById('wall').value=state.wall;save();updUndo();draw();msg('一つ前に戻しました')};
document.getElementById('zoomIn').onclick=()=>{const r=c.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25)};
document.getElementById('zoomOut').onclick=()=>{const r=c.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.8)};
const floorSel=document.getElementById('floor');floorSel.value=state.floor;floorSel.onchange=e=>{snapshot();state.floor=e.target.value;save();draw()};
const wallSel=document.getElementById('wall');wallSel.value=state.wall;wallSel.onchange=e=>{snapshot();state.wall=e.target.value;save();draw()};
document.getElementById('reset').onclick=()=>{if(confirm('部屋の配置を初期化しますか？')){localStorage.removeItem(KEY2);localStorage.removeItem(KEY1);location.reload()}};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='little-living-town-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);msg('セーブデータを書き出しました')};
const importFile=document.getElementById('importFile');
document.getElementById('importBtn').onclick=()=>importFile.click();
importFile.onchange=()=>{const f=importFile.files&&importFile.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const s=sanitize(JSON.parse(rd.result));if(!s){msg('読み込めない形式のファイルです');return}snapshot();state=s;selected=null;floorSel.value=state.floor;wallSel.value=state.wall;save();draw();msg('セーブデータを読み込みました')}catch(e){msg('読み込みに失敗しました')}};rd.readAsText(f);importFile.value=''};
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};move(...m[b.dataset.dir])});
window.addEventListener('keydown',e=>{if(mode!=='walk')return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}});
window.addEventListener('resize',resize);
updatePalette();updUndo();setMode('edit');resize();
})();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
