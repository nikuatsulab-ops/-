<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Little Living Town - Prototype 0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efe5;color:#453d35;font-family:system-ui,-apple-system,sans-serif}header{padding:10px 14px;background:#fff9ef;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:16px;margin:0}button,select{border:1px solid #c8b8a4;border-radius:10px;background:#fffaf2;color:#453d35;padding:10px;font-size:14px}button.active{background:#d2e7cb;border-color:#82aa78}button:disabled{opacity:.45}.toolbar,.palette,.bottom{display:flex;gap:6px;padding:8px;overflow-x:auto;align-items:center}.toolbar{background:#eee4d6}.palette{background:#faf5ed}.bottom{justify-content:center;flex-wrap:wrap}#stage{width:100%;height:min(66vh,650px);display:block;touch-action:none;background:#d9e4d2}small{display:block;padding:5px 12px;color:#766a5e}#status{font-size:12px;padding:4px 12px;min-height:24px} .pill{white-space:nowrap}.selected{outline:3px solid #83b79a} @media(max-width:600px){button,select{padding:9px;font-size:13px}#stage{height:57vh}}</style><meta name="theme-color" content="#f5efe5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Little Town"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>html,body{overscroll-behavior:none}body{min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#stage{-webkit-user-select:none;user-select:none}button{-webkit-tap-highlight-color:transparent}</style></head><body><header><h1>🌿 Little Living Town <span style="font-size:11px;font-weight:normal">v0.1</span></h1><button id="reset">初期化</button></header><div class="toolbar"><button id="edit" class="active">🛠 編集</button><button id="walk">🚶 散歩</button><button id="rotate">↻ 回転</button><button id="remove">🗑 撤去</button><button id="zoomOut">−</button><button id="zoomIn">＋</button><select id="floor"><option value="wood">床：木目</option><option value="cream">床：クリーム</option><option value="green">床：グリーン</option></select></div><canvas id="stage"></canvas><div class="palette" id="palette"></div><div class="bottom" id="arrows" style="display:none"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div id="status"></div><small>編集：家具を選んでタップで配置。家具をドラッグして移動。選択後に回転・撤去。散歩：矢印ボタン／画面タップ／キーボードで移動。変更は自動保存。</small><script>
(()=>{'use strict';const W=12,H=9,T=48,KEY='llt_v01_state';const TYPES={sofa:{name:'ソファ',w:2,h:1,c:'#c68f85',icon:'🛋️'},bed:{name:'ベッド',w:2,h:2,c:'#9fb9cc',icon:'🛏️'},table:{name:'テーブル',w:2,h:1,c:'#b88b60',icon:'🪵'},chair:{name:'椅子',w:1,h:1,c:'#c5a477',icon:'🪑'},shelf:{name:'棚',w:2,h:1,c:'#9d7956',icon:'📚'},plant:{name:'植物',w:1,h:1,c:'#6b9a72',icon:'🪴'},rug:{name:'ラグ',w:3,h:2,c:'#d7b3a4',icon:'🧶',pass:true},lamp:{name:'照明',w:1,h:1,c:'#edc46c',icon:'💡'}};let state={items:[{id:1,type:'bed',x:1,y:1,rot:0},{id:2,type:'sofa',x:7,y:2,rot:0},{id:3,type:'plant',x:10,y:1,rot:0},{id:4,type:'rug',x:5,y:5,rot:0}],floor:'wood',player:{x:6,y:7},nextId:5};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.items)&&saved.player)state={...state,...saved}}catch(e){}const c=document.getElementById('stage'),ctx=c.getContext('2d'),palette=document.getElementById('palette'),status=document.getElementById('status');let mode='edit',type='sofa',selected=null,drag=null,zoom=1,geom={};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const footprint=o=>{let t=TYPES[o.type];return {w:o.rot%2?t.h:t.w,h:o.rot%2?t.w:t.h}};const overlap=(a,b)=>{let x=footprint(a),y=footprint(b);return a.x<b.x+y.w&&a.x+x.w>b.x&&a.y<b.y+y.h&&a.y+x.h>b.y};const valid=(o,ignore)=>{let d=footprint(o);return o.x>=0&&o.y>=0&&o.x+d.w<=W&&o.y+d.h<=H&&!state.items.some(v=>v.id!==ignore&&!TYPES[v.type].pass&&!TYPES[o.type].pass&&overlap(o,v))};const hit=(x,y)=>[...state.items].reverse().find(o=>{let d=footprint(o);return x>=o.x&&x<o.x+d.w&&y>=o.y&&y<o.y+d.h});const msg=s=>status.textContent=s;function resize(){let rect=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function draw(){let cw=c.clientWidth,ch=c.clientHeight;ctx.clearRect(0,0,cw,ch);let s=Math.min((cw-24)/(W*T),(ch-24)/(H*T))*zoom,tw=T*s,ox=(cw-W*tw)/2,oy=(ch-H*tw)/2;geom={tw,ox,oy};ctx.fillStyle='#dce7d6';ctx.fillRect(0,0,cw,ch);ctx.fillStyle='#a17b61';ctx.fillRect(ox-8,oy-8,W*tw+16,H*tw+16);let floors={wood:['#e8cda6','#e4c69d'],cream:['#f0e7d4','#ece1cc'],green:['#cbdcb9','#c5d4b1']};for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=floors[state.floor]?.[(x+y)%2]||'#e8cda6';ctx.fillRect(ox+x*tw,oy+y*tw,tw,tw);ctx.strokeStyle='rgba(100,75,50,.10)';ctx.strokeRect(ox+x*tw,oy+y*tw,tw,tw)}ctx.fillStyle='#e8dfd2';ctx.fillRect(ox-8,oy-8,W*tw+16,8);ctx.fillRect(ox-8,oy-8,8,H*tw+16);for(let o of state.items){let d=footprint(o),px=ox+o.x*tw,py=oy+o.y*tw,w=d.w*tw,h=d.h*tw,t=TYPES[o.type];ctx.save();ctx.globalAlpha=t.pass?.78:1;ctx.fillStyle='rgba(69,53,43,.2)';ctx.fillRect(px+tw*.10,py+tw*.13,w-tw*.1,h-tw*.08);ctx.fillStyle=t.c;ctx.beginPath();ctx.roundRect(px+tw*.05,py+tw*.04,w-tw*.1,h-tw*.1,Math.max(3,tw*.13));ctx.fill();ctx.strokeStyle='rgba(80,55,42,.28)';ctx.lineWidth=1.5;ctx.stroke();ctx.font=`${Math.max(12,Math.min(tw*.62,36))}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.icon,px+w/2,py+h/2);ctx.restore();if(selected===o.id){ctx.strokeStyle='#347d60';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.strokeRect(px+2,py+2,w-4,h-4);ctx.setLineDash([])}}let p=state.player;ctx.fillStyle='#554b65';ctx.beginPath();ctx.ellipse(ox+(p.x+.5)*tw,oy+(p.y+.76)*tw,tw*.24,tw*.13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3d4b7';ctx.beginPath();ctx.arc(ox+(p.x+.5)*tw,oy+(p.y+.35)*tw,tw*.22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6c86aa';ctx.beginPath();ctx.roundRect(ox+(p.x+.29)*tw,oy+(p.y+.52)*tw,tw*.42,tw*.3,tw*.1);ctx.fill()}function point(e){let r=c.getBoundingClientRect();return {x:Math.floor((e.clientX-r.left-geom.ox)/geom.tw),y:Math.floor((e.clientY-r.top-geom.oy)/geom.tw)}}function updatePalette(){palette.innerHTML='';for(let [k,v] of Object.entries(TYPES)){let b=document.createElement('button');b.textContent=v.icon+' '+v.name;b.className='pill'+(k===type?' selected':'');b.onclick=()=>{type=k;selected=null;updatePalette();msg(v.name+'を選択しました')};palette.append(b)}}function setMode(m){mode=m;document.getElementById('edit').classList.toggle('active',m==='edit');document.getElementById('walk').classList.toggle('active',m==='walk');document.getElementById('arrows').style.display=m==='walk'?'flex':'none';msg(m==='edit'?'家具をタップして選択・ドラッグで移動':'画面タップまたは矢印で歩く');draw()}function move(dx,dy){let p=state.player,x=p.x+dx,y=p.y+dy;if(x<0||y<0||x>=W||y>=H)return;let block=state.items.some(o=>!TYPES[o.type].pass&&x>=o.x&&x<o.x+footprint(o).w&&y>=o.y&&y<o.y+footprint(o).h);if(!block){p.x=x;p.y=y;save();draw()}}c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);let p=point(e);if(p.x<0||p.y<0||p.x>=W||p.y>=H)return;if(mode==='walk'){let dx=p.x-state.player.x,dy=p.y-state.player.y;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy));return}let o=hit(p.x+.5,p.y+.5);if(o){selected=o.id;drag={id:o.id,offsetX:p.x-o.x,offsetY:p.y-o.y,oldX:o.x,oldY:o.y};msg(TYPES[o.type].name+'を選択中');draw()}else{let n={id:state.nextId++,type,x:p.x,y:p.y,rot:0};if(valid(n)){state.items.push(n);selected=n.id;save();draw();msg(TYPES[type].name+'を配置しました')}else msg('そこには配置できません')}});c.addEventListener('pointermove',e=>{if(!drag||mode!=='edit')return;let p=point(e),o=state.items.find(v=>v.id===drag.id);if(!o)return;let nx=p.x-drag.offsetX,ny=p.y-drag.offsetY;if(valid({...o,x:nx,y:ny},o.id)){o.x=nx;o.y=ny;draw()}});function endDrag(){if(drag){save();drag=null}}c.addEventListener('pointerup',endDrag);c.addEventListener('pointercancel',endDrag);document.getElementById('edit').onclick=()=>setMode('edit');document.getElementById('walk').onclick=()=>setMode('walk');document.getElementById('rotate').onclick=()=>{let o=state.items.find(v=>v.id===selected);if(!o)return msg('先に家具を選択してください');let next={...o,rot:(o.rot+1)%4};if(valid(next,o.id)){o.rot=next.rot;save();draw()}else msg('回転先に空きがありません')};document.getElementById('remove').onclick=()=>{if(selected===null)return;state.items=state.items.filter(o=>o.id!==selected);selected=null;save();draw()};document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(1.8,zoom+.15);draw()};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.65,zoom-.15);draw()};document.getElementById('floor').value=state.floor;document.getElementById('floor').onchange=e=>{state.floor=e.target.value;save();draw()};document.getElementById('reset').onclick=()=>{if(confirm('部屋の配置を初期化しますか？')){localStorage.removeItem(KEY);location.reload()}};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{let m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};move(...m[b.dataset.dir])});window.addEventListener('keydown',e=>{if(mode!=='walk')return;let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}});window.addEventListener('resize',resize);updatePalette();setMode('edit');resize()})();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
